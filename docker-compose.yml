services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careerbridge
      POSTGRES_PASSWORD: careerbridge
      POSTGRES_DB: careerbridge
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careerbridge']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - careerbridge-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  careerbridge-pgdata:
